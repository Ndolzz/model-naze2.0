name: finetune-nazeio

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID run sumber checkpoint"
        required: true
        type: string
      epochs:
        description: "Jumlah epoch fine-tuning campuran (default 8)"
        required: false
        default: "8"
        type: string
      block_size:
        description: "Ukuran jendela konteks (default 64; pasangan perintah terpanjang ~61 byte)"
        required: false
        default: "64"
        type: string
      artifact_name:
        description: "Nama artifact sumber (opsional; default naze-training-<run_id>, untuk chaining pakai nazeio-finetune-<run_id>)"
        required: false
        default: ""
        type: string

jobs:
  finetune:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependensi
        run: python -m pip install --upgrade pip && python -m pip install numpy
      - name: Pulihkan checkpoint dari artifact run sumber
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name != '' && github.event.inputs.artifact_name || format('naze-training-{0}', github.event.inputs.run_id) }}
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
          path: .
          artifact_fail_on_not_found: true
      - name: Fine-tuning command NazeIO (M-010)
        run: |
          python scripts/finetune_nazeio.py --checkpoint models/naze_v1 \
            --epochs "${{ github.event.inputs.epochs || '8' }}" \
            --block-size "${{ github.event.inputs.block_size || '64' }}"
        env:
          PYTHONPATH: src
      - name: Benchmark NazeIO (gate DECISION-023)
        run: python scripts/benchmark_nazeio.py --checkpoint models/naze_v1
        env:
          PYTHONPATH: src
      - name: Upload checkpoint fine-tuned + laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nazeio-finetune-${{ github.run_id }}
          path: |
            models/naze_v1/
            runs/
          retention-days: 30
          if-no-files-found: error
