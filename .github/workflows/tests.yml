name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependensi
        run: python -m pip install --upgrade pip && python -m pip install pytest pytest-cov numpy
      - name: Jalankan pytest penuh + coverage (D-019)
        run: python -m pytest tests/ -q --cov=naze --cov-fail-under=80
        env:
          PYTHONPATH: src
