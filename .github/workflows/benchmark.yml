name: benchmark

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID run training yang artifact-nya memuat checkpoint final"
        required: true
        type: string

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependensi
        run: python -m pip install --upgrade pip && python -m pip install numpy
      - name: Pulihkan checkpoint dari artifact run training
        uses: actions/download-artifact@v4
        with:
          name: naze-training-${{ github.event.inputs.run_id }}
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
          path: .
          artifact_fail_on_not_found: true
      - name: Benchmark NazeIO (M010-T008, gate DECISION-023)
        run: python scripts/benchmark_nazeio.py --checkpoint models/naze_v1
        env:
          PYTHONPATH: src
      - name: Upload laporan benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nazeio-benchmark-${{ github.run_id }}
          path: runs/benchmark_nazeio_report.json
          retention-days: 30
          if-no-files-found: error
